<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111222" />
  <meta name="description" content="Nailz! — a precision hammering arcade game." />
  <title>Nailz!</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <style id="critical-startup">
    html, body { margin: 0; width: 100%; height: 100%; background: #111222; }
    #app { visibility: hidden; }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="scene" aria-label="3D hammer, nail, and wooden block"></canvas>
    <header class="masthead"><span class="eyebrow">PRECISION. POWER. ONE PERFECT HIT.</span><h1>NAILZ<span>!</span></h1><p class="edition">NIGHT CARNIVAL</p></header>
    <section class="scene-caption" aria-label="Build status"><span class="status-dot"></span><div><strong>Every nail counts.</strong><p>Precision. Power. One perfect hit.</p></div></section>
    <div id="notice" role="status"></div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
