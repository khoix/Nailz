name: Game checks and production E2E
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Production E2E in Chromium on a virtual display
        run: xvfb-run --auto-servernum npm run test:e2e
        env:
          NAILZ_HEADED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-e2e-results
          path: artifacts/e2e/
          retention-days: 7
